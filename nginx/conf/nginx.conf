user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time '
                      'ut="$upstream_response_time" us="$upstream_status"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout   65;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout        60s;

    # Загрузка файлов через /moderator/upload/*.
    # Должно быть >= spring.servlet.multipart.max-request-size в environment.env (500MB).
    client_max_body_size 500m;
    client_body_buffer_size 1m;

    # Docker embedded DNS - чтобы nginx переразрешал имена контейнеров после их перезапуска.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Дефолты проксирования. Заданы здесь (а не в proxy_backend.conf), чтобы
    # отдельные location могли их переопределить, не получая "directive is duplicate".
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       on;
    proxy_buffer_size     16k;
    proxy_buffers         16 16k;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss application/rss+xml font/ttf font/otf
                      image/svg+xml application/manifest+json;

    # ---- Общие TLS-параметры (сертификаты подключаются в conf.d/default.conf) ----
    ssl_session_timeout  1d;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/conf.d/*.conf;
}
