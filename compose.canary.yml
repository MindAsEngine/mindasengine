# Оверлей для обкатки nginx на живом сервере ДО переключения портов.
#
#   docker compose -f compose.yml -f compose.canary.yml up -d --no-deps nginx
#
# nginx поднимается на 18080/18443 и проксирует на УЖЕ РАБОТАЮЩИЕ контейнеры
# frontend/backend - порт 80 остаётся за старым фронтом, посетители ничего не замечают.
# После проверки оверлей убирается, и nginx пересоздаётся на боевых 80/443.
#
# Тег !override обязателен: без него compose СКЛЕИВАЕТ списки ports, а не
# заменяет их. Вышло бы 80 + 443 + 18080 + 18443, порт 80 занят старым фронтом,
# контейнер не стартует, и на канареечном порту никто не отвечает.
# Требует Docker Compose 2.24.0+ (проверить: docker compose version).
#
# Порты нарочно нестандартные: 8080 часто занят чем-то посторонним.
# Перед запуском проверить: ss -lnt | grep -E ':(18080|18443)' - должно быть пусто.
services:
  nginx:
    ports: !override
      - '18080:80'
      - '18443:443'
