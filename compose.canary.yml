# Оверлей для обкатки nginx на живом сервере ДО переключения портов.
#
#   docker compose -f compose.yml -f compose.canary.yml up -d --no-deps nginx
#
# nginx поднимается на 8080/8443 и проксирует на УЖЕ РАБОТАЮЩИЕ контейнеры
# frontend/backend - порт 80 остаётся за старым фронтом, посетители ничего не замечают.
# После проверки оверлей убирается, и nginx пересоздаётся на боевых 80/443.
services:
  nginx:
    ports:
      - '8080:80'
      - '8443:443'
